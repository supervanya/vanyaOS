name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # `actions: read` lets `migrate` look up the last successful deploy.
  actions: read
  contents: read
  pages: write
  id-token: write

# Never cancel a run in flight: it may be mid `supabase db push`. A newer push
# waits for it instead. (Queue order isn't guaranteed; if two quick pushes ever
# deploy out of order, re-run the workflow.)
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Not a secret — it's in the app's public Supabase URL already.
  SUPABASE_PROJECT_REF: czyzqztbpggtnwvohakd

jobs:
  # Gate: the ruleset's CI checks can be bypassed by a direct push to main, so
  # re-run them here before anything touches the hosted project. Build is in
  # the gate too — failing it after `migrate` would leave prod schema ahead of
  # the app.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node and Bun at the versions pinned in mise.toml.
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build

  # Migrations apply BEFORE the frontend builds/deploys, so schema and app move
  # together — a failed migration blocks the deploy instead of skewing it.
  # Skipped when nothing under supabase/ changed since the last successful
  # deploy — not since the previous push, which would strand a migration whose
  # run failed or deployed out of order. The job still succeeds, so the
  # frontend still ships.
  migrate:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the last deployed commit is there to diff against.
          fetch-depth: 0
      - name: Anything under supabase/ since the last deploy?
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --workflow deploy.yml --branch main --status success --limit 20 --json headSha,createdAt --jq 'sort_by(.createdAt) | last | .headSha // empty')
          # A manual run, no previous deploy, or a commit lost to a force-push:
          # deploy to be safe.
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || -z "$last" ]] \
            || ! git cat-file -e "$last^{commit}" 2>/dev/null \
            || ! git diff --quiet "$last" HEAD -- supabase/; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing under supabase/ changed since $last; skipping."
          fi
      - if: steps.changes.outputs.deploy == 'true'
        uses: supabase/setup-cli@v3
        with:
          # Must be >= the version that generated supabase/config.toml (see the
          # `supabase` devDependency) — the action's default lags far behind and
          # chokes on newer config keys.
          version: 2.109.0
      - if: steps.changes.outputs.deploy == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - if: steps.changes.outputs.deploy == 'true'
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Edge Functions ship with the same merge that ships their schema.
      - if: steps.changes.outputs.deploy == 'true'
        run: supabase functions deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  build:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node and Bun at the versions pinned in mise.toml.
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          # Publishable, not secret — RLS is the security boundary (ADR-002).
          # Set via `gh variable set` (repo Settings > Secrets and variables > Actions > Variables).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: SPA fallback + .nojekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # v4+ drops dotfiles by default; keep .nojekyll as before.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
