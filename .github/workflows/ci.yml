name: CI

# Runs on every push to a PR branch: the same gate as the local git hooks, for
# anything that got past them. Each job is a required status check in the
# `main-branch` ruleset, so a failure blocks the merge.
on:
  pull_request:

permissions:
  contents: read

# A new push to the same PR supersedes the run in flight.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    # Job names are the status-check names the ruleset requires — rename both together.
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Report every failing check, not just the first.
      fail-fast: false
      matrix:
        include:
          - name: Format
            run: bun run format:check
          - name: Lint
            run: bun run lint
          - name: Typecheck
            run: bun run typecheck
          - name: Test
            run: bun run test
          - name: Build
            run: bun run build
          - name: Knip
            run: bun run knip
    steps:
      - uses: actions/checkout@v7
      # Node and Bun at the versions pinned in mise.toml.
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      - run: ${{ matrix.run }}

  # The ai-coach Edge Function runs on Deno, outside the app's tsconfig; check
  # it the way the Supabase runtime resolves it (npm: specifiers, no package.json).
  edge-function:
    name: Edge Function
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/ai-coach/index.ts
        env:
          DENO_NO_PACKAGE_JSON: "1"

  # Validates the migrations without production credentials: new ones must sort
  # after main's, they must apply cleanly to a throwaway Postgres (`db start`
  # fails on the first statement that errors), and the generated DB types must
  # match them. Fix type drift locally with `bun run db:types` against a stack
  # that has the new migration applied.
  db-types:
    name: DB types
    runs-on: ubuntu-latest
    env:
      # Pull the CLI's images from ghcr instead of public.ecr.aws, which rate-limits
      # when several PRs run this job at once.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR's merge commit plus its first parent, the tip of main.
          fetch-depth: 2
      # Production has already applied everything on main, and `supabase db push`
      # refuses a migration that sorts before those — so it would fail only after merge.
      - name: New migrations sort after main's
        env:
          LC_ALL: C
        run: |
          latest=$(git ls-tree --name-only HEAD^1 supabase/migrations/ | sort | tail -n 1)
          status=0
          for f in $(git diff --name-only --diff-filter=A HEAD^1 HEAD -- supabase/migrations/); do
            if [[ ! "$f" > "$latest" ]]; then
              echo "::error file=$f::Sorts before $latest, already on main. Give it a newer timestamp."
              status=1
            fi
          done
          exit $status
      - uses: supabase/setup-cli@v3
        with:
          # Keep in step with the `supabase` devDependency and deploy.yml.
          version: 2.109.0
      - run: supabase db start
      - run: supabase gen types typescript --local --schema public > src/lib/database.types.ts
      - name: Types match the migrations
        run: git diff --exit-code -- src/lib/database.types.ts
