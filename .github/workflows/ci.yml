name: CI

# Runs on every push to a PR branch: the same gate as the local git hooks, for
# anything that got past them. Each job is a required status check in the
# `main-branch` ruleset, so a failure blocks the merge.
on:
  pull_request:

permissions:
  contents: read

# A new push to the same PR supersedes the run in flight.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    # Job names are the status-check names the ruleset requires — rename both together.
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Report every failing check, not just the first.
      fail-fast: false
      matrix:
        include:
          - name: Format
            run: bun run format:check
          - name: Lint
            run: bun run lint
          - name: Typecheck
            run: bun run typecheck
          - name: Test
            run: bun run test
          - name: Build
            run: bun run build
    steps:
      - uses: actions/checkout@v7
      # Node and Bun at the versions pinned in mise.toml.
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      - run: ${{ matrix.run }}

  # The ai-coach Edge Function runs on Deno, outside the app's tsconfig; check
  # it the way the Supabase runtime resolves it (npm: specifiers, no package.json).
  edge-function:
    name: Edge Function
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/ai-coach/index.ts
        env:
          DENO_NO_PACKAGE_JSON: "1"
