name: CI

# Runs on every push to a PR branch: the same gate as the local git hooks, for
# anything that got past them. Each job is a required status check in the
# `main-branch` ruleset, so a failure blocks the merge.
on:
  pull_request:

permissions:
  contents: read

# A new push to the same PR supersedes the run in flight.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    # Job names are the status-check names the ruleset requires — rename both together.
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Report every failing check, not just the first.
      fail-fast: false
      matrix:
        include:
          - name: Format
            run: bun run format:check
          - name: Lint
            run: bun run lint
          - name: Typecheck
            run: bun run typecheck
          - name: Test
            run: bun run test
          - name: Build
            run: bun run build
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: ${{ matrix.run }}
